<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>{{ product.name }} - {{ app_name }}</title>
	<style>
		body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f7fa; }
		.card { background:#fff; border:1px solid #ddd; border-radius:8px; padding:1rem; max-width: 860px; }
		img { width:100%; max-height:320px; object-fit:cover; border-radius:6px; }
		.badge { font-size: .75rem; background:#f39c12; color:#fff; padding:2px 8px; border-radius:4px; }
		.actions a { background:#666; color:#fff; text-decoration:none; padding:.45rem .8rem; border-radius:6px; }
	</style>
</head>
<body>
	<div class="card">
		<a href="{% url 'main:show_main' %}" class="back">← Back</a>
		<h1 style="margin:.25rem 0 0;">{{ product.name }}</h1>
		<p>IDR {{ product.price }}</p>
		{% if product.is_featured %}<span class="badge">Featured</span>{% endif %}
		<img src="{{ product.thumbnail }}" alt="{{ product.name }} image" onerror="this.src='https://via.placeholder.com/800x320?text=No+Image';">
		<p style="margin-top:1rem;">{{ product.description }}</p>
		<p style="font-size:.9rem; color:#555;">Category: {{ product.get_category_display }}</p>
		<p style="font-size:.85rem; color:#777;">Created at: {{ product.created_at }} | Updated at: {{ product.updated_at }}</p>
	</div>
</body>
</html>
