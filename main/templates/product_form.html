<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Add Product - {{ app_name }}</title>
	<style>
		body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f7fa; }
		.container { background:#fff; border:1px solid #ddd; border-radius:8px; padding:1rem; max-width: 720px; }
		.actions a, .actions button { background:#0a4; color:#fff; border:none; padding:.5rem .9rem; border-radius:6px; text-decoration:none; cursor:pointer; display:inline-block; }
		.actions a.secondary { background:#666; }
		label { display:block; margin:.35rem 0; font-weight:600; }
		input[type="text"], input[type="number"], textarea, select { width:100%; padding:.45rem .6rem; border:1px solid #ccc; border-radius:6px; }
	</style>
</head>
<body>
	<div class="container">
		<h1 style="margin-top:0;">Add Product</h1>
		<form method="post">
			{% csrf_token %}
			<label>Name
				{{ form.name }}
			</label>
			<label>Price
				{{ form.price }}
			</label>
			<label>Description
				{{ form.description }}
			</label>
			<label>Thumbnail URL
				{{ form.thumbnail }}
			</label>
			<label>Category
				{{ form.category }}
			</label>
			<label>Featured?
				{{ form.is_featured }}
			</label>
			<div class="actions" style="margin-top: .75rem; display:flex; gap:.5rem;">
				<button type="submit">Save</button>
				<a href="{% url 'main:show_main' %}" class="secondary">Back</a>
			</div>
		</form>
	</div>
</body>
</html>
